<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17283a">
<title>PANORAMA CAFE — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="Panorama Cafe">P</div>
  <div class="logo">PANORAMA CAFE</div>
  <div class="tag">CAFE & LOUNGE</div>
  <p>أفضل إطلالة... وأجمل لحظة ✦</p>
</header>

<main>
  <section class="intro">
    <span>WELCOME</span>
    <h1>أهلاً بك في بانوراما كافيه 🤍</h1>
    <p>اختار قسمك واستمتع بالمنيو</p>
  </section>

  <div class="categories">
    <button class="cat active" data-cat="hot">☕<b>الساخنة</b><small>Hot Drinks</small></button>
    <button class="cat" data-cat="cold">🧊<b>الباردة</b><small>Cold & Smoothies</small></button>
    <button class="cat" data-cat="special">✨<b>المختصة</b><small>Specialty Coffee</small></button>
    <button class="cat" data-cat="cocktails">🍹<b>كوكتيلات</b><small>Juices & Cocktails</small></button>
    <button class="cat" data-cat="desserts">🍰<b>الحلويات</b><small>Desserts</small></button>
    <button class="cat" data-cat="shisha">♨️<b>الأراجيل</b><small>Shisha</small></button>
  </div>

  <section class="panel">
    <div class="heading"><div><span id="kicker">HOT DRINKS</span><h2 id="title">الشاي والقهوة الساخنة</h2></div><i>☾</i></div>
    <div id="items"></div>
  </section>

  <footer>
    <div>— أفضل إطلالة... وأجمل لحظة —</div>
    <strong>PANORAMA CAFE</strong>
    <small>CAFE & LOUNGE</small>
  </footer>
</main>
<script src="script.js"></script>
</body>
</html>
